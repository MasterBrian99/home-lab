apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      containers:
        - name: authelia
          image: authelia/authelia
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: authelia-env
                  key: TZ
          volumeMounts:
            - mountPath: /config
              name: authelia-config
      volumes:
        - name: authelia-config
          persistentVolumeClaim:
            claimName: authelia-storage