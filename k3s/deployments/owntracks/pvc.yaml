apiVersion: v1
kind: PersistentVolume
metadata:
  name: owntracks-config
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/home/brian/storage/owntracks/recorder/config"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: owntracks-config
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: owntracks-store
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/home/brian/storage/owntracks/recorder/store"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: owntracks-store
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
